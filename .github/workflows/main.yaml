name: TENS-S3 Build Pipeline

on:
  push:
    branches: [ "main", "ccc" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache PlatformIO and ESP-IDF Toolchain
        uses: actions/cache@v3
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini', '**/dependencies.lock') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Run Static Analysis
        run: pio check --fail-on-defects low

      - name: Compile Project
        run: pio run -e esp32-s3-devkitm-1

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TENS-S3-Firmware
          path: |
            .pio/build/esp32-s3-devkitm-1/firmware.bin
            .pio/build/esp32-s3-devkitm-1/partitions.bin
            .pio/build/esp32-s3-devkitm-1/bootloader.bin